services:
  bot:
    build: .
    container_name: torbox-bot
    env_file:
      - .env
    environment:
      DB_PATH: /data/torbox_bot.db
      PROWLARR_URL: http://prowlarr:9696

    volumes:
      - bot-data:/data
    ports:
      - "8080:8080"
    depends_on:
      - prowlarr
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
    volumes:
      - prowlarr-config:/config
    ports:
      - "127.0.0.1:9696:9696"
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    restart: unless-stopped

volumes:
  bot-data:
  prowlarr-config:
